<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Operator · ConneX prototype</title>
<style>
  :root {
    --ink: #14161f; --muted: #6b7080; --line: #e6e7ec; --bg: #f6f7f9; --panel: #ffffff;
    --brand: #4b3fd8; --brand-soft: #eeecff; --ok: #16794c; --ok-soft: #e7f6ee;
    --warn: #9a5b00; --warn-soft: #fff4e0; --bad: #b42318; --bad-soft: #fdecea;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: var(--ink); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  .logo { font-weight: 700; letter-spacing: -.01em; }
  .logo span { color: var(--brand); }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .modes { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .modes button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer;
                  font: inherit; font-size: 13px; color: var(--muted); }
  .modes button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .btn-ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px;
               font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px max(20px, calc(50% - 360px)); }
  .hello { text-align: center; margin: 8vh 0 24px; }
  .hello h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
  .hello p { color: var(--muted); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px;
          font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }

  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; }
  .user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .ai .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .ai .bubble ul { margin: 4px 0; padding-left: 20px; white-space: normal; }
  .tool { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin: 4px 0 4px 2px; }
  .tool b { color: var(--ink); font-weight: 600; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 6px;
         font-family: -apple-system, sans-serif; }
  .tag.read { background: var(--brand-soft); color: var(--brand); }
  .tag.write { background: var(--warn-soft); color: var(--warn); }
  .tool.err { color: var(--bad); }
  .confirm { border: 1px solid #f1d29b; background: var(--warn-soft); border-radius: var(--radius);
             padding: 12px 14px; margin: 10px 0; max-width: 82%; }
  .confirm .what { font-weight: 600; margin-bottom: 10px; }
  .confirm .note { font-size: 12px; color: var(--warn); margin-bottom: 10px; }
  .confirm button { font: inherit; font-size: 14px; border-radius: 8px; padding: 6px 14px; cursor: pointer; margin-right: 6px; }
  .yes { background: var(--ok); color: #fff; border: 1px solid var(--ok); }
  .no { background: var(--panel); border: 1px solid var(--line); }
  .confirm.done button { display: none; }
  .status { font-size: 13px; margin: 4px 0 4px 2px; }
  .status.ok { color: var(--ok); } .status.cancel { color: var(--bad); }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0; }
  .typing { color: var(--muted); font-size: 13px; margin: 8px 2px; }

  form { display: flex; gap: 8px; padding: 14px max(20px, calc(50% - 360px)) 18px; border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font: inherit; outline: none; }
  #input:focus { border-color: var(--brand); }
  #send { border: 0; background: var(--brand); color: #fff; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 12px 14px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--muted);
                 border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button.on { color: var(--ink); border-color: var(--brand); font-weight: 600; }
  .aside-head { padding: 10px 14px 0; font-size: 12px; color: var(--muted); }
  #panel { overflow-y: auto; padding: 8px 14px 20px; }
  .row { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 8px 0; font-size: 13px; transition: background 1.2s; }
  .row.flash { background: var(--ok-soft); border-color: #a8dcc0; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .name { font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
  .pill.new { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
  .pill.done, .pill.won { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .pill.overdue, .pill.lost { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">ConneX <span>AI Operator</span></div>
  <div class="meta" id="meta">connecting…</div>
  <div class="spacer"></div>
  <div class="modes" role="tablist" aria-label="Mode">
    <button data-mode="ask" title="Read-only: look things up">Ask</button>
    <button data-mode="run" class="on" title="Can make changes, always after your confirmation">Run a task</button>
  </div>
  <button class="btn-ghost" id="reset" title="Rebuild the mock data and clear the chat">Reset demo</button>
</header>

<main>
  <section id="chat">
    <div id="log">
      <div class="hello" id="hello">
        <h1>How can I help you today?</h1>
        <p>Ask a question or run a task across your CRM.</p>
        <div class="chips">
          <button class="chip">How many leads came in this week?</button>
          <button class="chip">Find leads I haven't contacted this week</button>
          <button class="chip">What's on tomorrow?</button>
          <button class="chip">Create a task to call Aisha Khan on Friday</button>
          <button class="chip">Mark Tom Fletcher as contacted</button>
          <button class="chip">Which tasks are overdue?</button>
        </div>
      </div>
    </div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Ask a question or run a task across your CRM." aria-label="Message">
      <button id="send">Send</button>
    </form>
  </section>

  <aside>
    <div class="tabs">
      <button data-tab="leads" class="on">Leads</button>
      <button data-tab="tasks">Tasks</button>
      <button data-tab="events">Calendar</button>
    </div>
    <div class="aside-head">Live mock CRM data · updates after each reply</div>
    <div id="panel"></div>
  </aside>
</main>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), send = $("#send");
let sessionId = null, busy = false, tab = "leads", data = null, prevData = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function md(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    out += l + "\n";
  }
  return (inList ? out + "</ul>" : out).replace(/\n+$/, "");
}

function add(html, cls = "") {
  $("#hello")?.remove();
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function args(a) {
  if (!a || typeof a !== "object") return "";
  return Object.entries(a).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
}

function render(events) {
  for (const e of events) {
    if (e.type === "tool_call") {
      const write = e.mode === "write";
      add(`${write ? "proposes" : "calls"} <b>${esc(e.name)}</b>(${esc(args(e.args))})<span class="tag ${write ? "write" : "read"}">${write ? "needs confirmation" : "read-only"}</span>`, "tool");
    } else if (e.type === "tool_result" && !e.ok) {
      add(`${esc(e.name)} → ${esc(e.data?.error || "error")}`, "tool err");
    } else if (e.type === "assistant") {
      add(`<div class="bubble">${md(e.text)}</div>`, "msg ai");
    } else if (e.type === "confirm") {
      const box = add(`<div class="what">${esc(e.summary)}</div>
        <div class="note">Nothing has changed yet. This runs only if you confirm.</div>
        <button class="yes">Confirm</button><button class="no">Cancel</button>`, "confirm");
      box.querySelector(".yes").onclick = () => { box.classList.add("done"); chat("yes"); };
      box.querySelector(".no").onclick = () => { box.classList.add("done"); chat("no"); };
    } else if (e.type === "executed") {
      document.querySelectorAll(".confirm").forEach((b) => b.classList.add("done"));
      add(`calls <b>${esc(e.name)}</b>(${esc(args(e.args))})<span class="tag write">write</span>`, "tool");
      add(`✓ Done: ${esc(e.summary)}`, "status ok");
    } else if (e.type === "cancelled") {
      document.querySelectorAll(".confirm").forEach((b) => b.classList.add("done"));
      add(`✗ Not done (not confirmed): ${esc(e.summary)}`, "status cancel");
    } else if (e.type === "error") {
      add(esc(e.text), "error");
    }
  }
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`Server error ${r.status}`);
  return r.json();
}

async function chat(text) {
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true;
  add(`<div class="bubble">${esc(text)}</div>`, "msg user");
  const typing = add("AI Operator is working…", "typing");
  try {
    const res = await post("/api/chat", { session_id: sessionId, message: text });
    sessionId = res.session_id || sessionId;
    typing.remove();
    render(res.events);
    setMode(res.mode, false);
  } catch (err) {
    typing.remove();
    add(`Could not reach the server: ${esc(err.message)}`, "error");
  } finally {
    busy = false; send.disabled = false; input.focus();
    loadData();
  }
}

function setMode(mode, remote = true) {
  const apply = () => document.querySelectorAll(".modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  if (!remote) return apply();
  post("/api/mode", { session_id: sessionId, mode }).then((r) => {
    if (!r.ok) return add(esc(r.error), "error");
    sessionId = r.session_id; apply();
    add(mode === "ask" ? "Switched to Ask: read-only, nothing can be changed." : "Switched to Run a task: changes are allowed, each one needs your confirmation.", "typing");
  });
}

function changed(kind, item) {
  if (!prevData) return false;
  const old = prevData[kind].find((x) => x.id === item.id);
  return !old || JSON.stringify(old) !== JSON.stringify(item);
}

function renderPanel() {
  if (!data) return;
  const today = new Date().toISOString().slice(0, 10);
  let html = "";
  if (tab === "leads") {
    for (const l of data.leads) html += `<div class="row${changed("leads", l) ? " flash" : ""}">
      <div class="top"><span class="name">${esc(l.name)} <span class="sub">${esc(l.id)}</span></span><span class="pill ${esc(l.status)}">${esc(l.status.replace("_", " "))}</span></div>
      <div class="sub">${esc(l.type)} · ${esc(l.source)} · ${esc(l.assigned_to || "unassigned")}</div>
      <div class="sub">${esc(l.interest)}</div>
      <div class="sub">created ${esc(l.created_on)} · last contact ${esc(l.last_contacted || "never")}</div></div>`;
  } else if (tab === "tasks") {
    for (const t of [...data.tasks].sort((a, b) => a.due.localeCompare(b.due))) {
      const overdue = t.status === "open" && t.due < today;
      html += `<div class="row${changed("tasks", t) ? " flash" : ""}">
      <div class="top"><span class="name">${esc(t.title)}</span><span class="pill ${overdue ? "overdue" : esc(t.status)}">${overdue ? "overdue" : esc(t.status)}</span></div>
      <div class="sub">${esc(t.id)} · due ${esc(t.due)}${t.related_to ? " · " + esc(t.related_to) : ""}</div></div>`;
    }
  } else {
    for (const e of [...data.events].sort((a, b) => a.start.localeCompare(b.start))) html += `<div class="row">
      <div class="top"><span class="name">${esc(e.title)}</span><span class="pill">${esc(e.type)}</span></div>
      <div class="sub">${esc(e.start.replace("T", " "))} – ${esc(e.end.slice(11))} · ${esc(e.location)}</div></div>`;
  }
  $("#panel").innerHTML = html;
}

async function loadData() {
  try {
    const next = await (await fetch("/api/data")).json();
    prevData = data; data = next; renderPanel();
  } catch {}
}

$("#form").onsubmit = (e) => { e.preventDefault(); const t = input.value; input.value = ""; chat(t); };
document.querySelectorAll(".chip").forEach((c) => c.onclick = () => chat(c.textContent));
document.querySelectorAll(".modes button").forEach((b) => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  prevData = null; renderPanel();
});
$("#reset").onclick = async () => {
  await post("/api/reset", { session_id: sessionId });
  log.innerHTML = ""; add("Demo reset: mock data rebuilt and conversation cleared.", "typing");
  prevData = null; loadData();
};

fetch("/api/info").then((r) => r.json()).then((i) => {
  $("#meta").textContent = i.ok ? `${i.agency} · ${i.provider} / ${i.model}` : "No model configured";
  if (!i.ok) add(esc(i.error), "error");
});
loadData();
input.focus();
</script>
</body>
</html>
